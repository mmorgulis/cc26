<polygon class="head" points="308.0,51.7 292.6,56.5 292.6,46.9" fill="#7d7d7d"/>
<rect class="cell" x="44.0" y="114.4" width="400.4" height="108.9" rx="4.0" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="ink" x="59.4" y="144.4" text-anchor="start" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">def lambda_0(fvs, x) -&gt; int:</text>
<text class="ink" x="59.4" y="176.3" text-anchor="start" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">    y = fvs[1]</text>
