<rect class="cell" x="308.0" y="33.0" width="52.8" height="37.4" rx="4.0" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="1.5"/>
<text class="ink" x="334.4" y="59.2" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">a</text>
<text class="note" x="334.4" y="23.1" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.2" fill="#5f6874">the box for y: a 1-tuple</text>
