<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="462" height="270" viewBox="0 0 462 270" role="img" aria-label="the closure of the running example in memory: the variable f points at a 2-tuple on the heap whose element 0 points at the lifted function lambda_0 and whose element 1 points at the box for y, a 1-tuple on the heap holding a; both tuples are allocated and collected like any other, only the code is static">

