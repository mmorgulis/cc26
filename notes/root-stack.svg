<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="790" height="299" viewBox="0 0 790 299" role="img" aria-label="the frame and the root stack side by side: the frame holds the return address, the old %rbp and the integer-typed variables, and the collector never reads it; the root stack holds nothing but tuple pointers, %r15 marks its first free slot, and walking it is the whole of the collector's root scan">

  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #16181d; }
      .cell rect { fill: #272c34; stroke: #8b95a3; }
      .ghost rect { fill: #16181d; stroke: #8b95a3; }
      .cell text, .ghost text, .title { fill: #e4e8ee; }
      .note { fill: #9aa3b0; }
      .ptr text { fill: #e4e8ee; }
      .ptr line { stroke: #8b95a3; }
      .ptr polygon { fill: #8b95a3; }
    }
  </style>
<rect class="bg" x="0" y="0" width="790" height="299" fill="#ffffff"/>
<text class="title" x="258.8" y="39.6" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.8" font-weight="bold" fill="#1c1f24">the frame</text>
<g class="cell">
<rect x="104.8" y="53.2" width="308.0" height="34.3" rx="4.0" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="1.5"/>
<text x="258.8" y="77.9" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">return address</text>
</g>
<g class="cell">
<rect x="104.8" y="92.8" width="308.0" height="34.3" rx="4.0" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="1.5"/>
<text x="258.8" y="117.5" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">old %rbp</text>
</g>
<g class="ptr"><text x="15.4" y="116.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="18.9" fill="#1c1f24">%rbp</text><line x1="67.4" y1="110.0" x2="79.5" y2="110.0" stroke="#7d7d7d" stroke-width="1.5"/><polygon points="94.9,110.0 79.5,105.2 79.5,114.8" fill="#7d7d7d"/></g>
<g class="cell">
<rect x="104.8" y="132.4" width="308.0" height="34.3" rx="4.0" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="1.5"/>
<text x="258.8" y="157.1" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">i  (an int, spilled)</text>
</g>
<g class="cell">
<rect x="104.8" y="172.0" width="308.0" height="34.3" rx="4.0" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="1.5"/>
<text x="258.8" y="196.7" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">n  (an int, silled)</text>
</g>
<text class="note" x="258.8" y="240.9" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.2" fill="#5f6874">spilled scalar locals and temporaries;</text>
<text class="note" x="258.8" y="273.9" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.2" fill="#5f6874">collect never reads it</text>
<text class="title" x="673.8" y="79.2" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.8" font-weight="bold" fill="#1c1f24">the root stack</text>
<g class="ghost">
<rect x="572.6" y="92.8" width="202.4" height="34.3" rx="4.0" fill="#ffffff" stroke="#7d7d7d" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="673.8" y="117.5" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">(free)</text>
</g>
<g class="ptr"><text x="483.2" y="116.6" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="18.9" fill="#1c1f24">%r15</text><line x1="535.2" y1="110.0" x2="547.3" y2="110.0" stroke="#7d7d7d" stroke-width="1.5"/><polygon points="562.7,110.0 547.3,105.2 547.3,114.8" fill="#7d7d7d"/></g>
<g class="cell">
<rect x="572.6" y="132.4" width="202.4" height="34.3" rx="4.0" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="1.5"/>
<text x="673.8" y="157.1" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">u  (a tuple)</text>
</g>
<g class="cell">
<rect x="572.6" y="172.0" width="202.4" height="34.3" rx="4.0" fill="#f0f0f0" stroke="#7d7d7d" stroke-width="1.5"/>
<text x="673.8" y="196.7" text-anchor="middle" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="22.0" fill="#1c1f24" xml:space="preserve">t  (a tuple)</text>
</g>
<text class="note" x="673.8" y="240.9" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.2" fill="#5f6874">pointers, nothing else;</text>
<text class="note" x="673.8" y="273.9" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.2" fill="#5f6874">what collect walks</text>
</svg>
